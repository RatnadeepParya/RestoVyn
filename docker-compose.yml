version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: restovyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restovyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-restovyn_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restovyn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restovyn-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: restovyn-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-restovyn}:${POSTGRES_PASSWORD:-resto_secret_pass}@postgres:5432/${POSTGRES_DB:-restovyn_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-restovyn_production_jwt_secret_change_me_32char}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-restovyn_production_jwt_refresh_change_me_32char}
    ports:
      - "4000:4000"

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: restovyn-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
