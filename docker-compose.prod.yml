# =====================================================================
# RestoVyn Enterprise Multi-Container Production Topology
# High Availability POS, PgBouncer Pooling, Redis AOF, NGINX Gateway
# =====================================================================

version: "3.8"

services:
  # -------------------------------------------------------------------
  # 1. POSTGRESQL 16 ENTERPRISE (Tuned for High Transaction Volume)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restovyn-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restovyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-restovyn_db}
      POSTGRES_READONLY_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-readonly_pass_123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-restovyn} -d ${POSTGRES_DB:-restovyn_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal_backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

  # -------------------------------------------------------------------
  # 2. PGBOUNCER (High-Throughput Connection Pooler: 1,000 POS Clients)
  # -------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    container_name: restovyn-prod-pgbouncer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infrastructure/docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - internal_backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-restovyn}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # -------------------------------------------------------------------
  # 3. REDIS 7 ENTERPRISE (AOF Persistence + LRU Eviction)
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restovyn-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - internal_backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # -------------------------------------------------------------------
  # 4. RESTOVYN API GATEWAY & CORE (NestJS Clustering & dumb-init)
  # -------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile.prod
    image: restovyn/api:latest
    container_name: restovyn-prod-api
    restart: always
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Connect via PgBouncer transaction pool on port 6432 with pgbouncer parameter
      DATABASE_URL: postgresql://${POSTGRES_USER:-restovyn}:${POSTGRES_PASSWORD:-resto_secret_pass}@pgbouncer:6432/${POSTGRES_DB:-restovyn_db}?schema=public&pgbouncer=true
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-restovyn_enterprise_prod_secret_min32chars_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-restovyn_enterprise_prod_refresh_secret_min32chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - internal_backend
      - internal_ingress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  # -------------------------------------------------------------------
  # 5. ADMIN WEB PANEL (Next.js Standalone SSR)
  # -------------------------------------------------------------------
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile.prod
    image: restovyn/admin-web:latest
    container_name: restovyn-prod-admin
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost}
    networks:
      - internal_ingress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # -------------------------------------------------------------------
  # 6. NGINX HIGH-PERFORMANCE REVERSE PROXY & GATEWAY
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: restovyn-prod-nginx
    restart: always
    depends_on:
      - api
      - admin-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - internal_ingress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # -------------------------------------------------------------------
  # 7. POSTGRES EXPORTER (Prometheus Metrics)
  # -------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: restovyn-prod-pg-exporter
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-restovyn}:${POSTGRES_PASSWORD:-resto_secret_pass}@postgres:5432/${POSTGRES_DB:-restovyn_db}?sslmode=disable
    networks:
      - internal_backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # -------------------------------------------------------------------
  # 8. REDIS EXPORTER (Prometheus Metrics)
  # -------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0-alpine
    container_name: restovyn-prod-redis-exporter
    restart: always
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - internal_backend
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

# ---------------------------------------------------------------------
# VOLUMES & ISOLATED NETWORK TOPOLOGY
# ---------------------------------------------------------------------
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  internal_backend:
    driver: bridge
    internal: true
  internal_ingress:
    driver: bridge
