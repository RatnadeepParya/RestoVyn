# =====================================================================
# RestoVyn Enterprise Observability Stack
# Prometheus, Grafana, Alertmanager & Node Exporters
# =====================================================================

version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: restovyn-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - monitoring_net
      - internal_backend

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: restovyn-alertmanager
    restart: always
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/data
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/data"
    ports:
      - "9093:9093"
    networks:
      - monitoring_net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: restovyn-grafana
    restart: always
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-restovyn_monitor_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clock-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - monitoring_net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: restovyn-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - monitoring_net

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  monitoring_net:
    driver: bridge
  internal_backend:
    external: true
    name: restovyn_internal_backend
