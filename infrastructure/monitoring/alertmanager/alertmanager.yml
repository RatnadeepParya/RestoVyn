global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "restaurant-ops-team"
  routes:
    - match:
        severity: critical
      receiver: "emergency-pager"
      repeat_interval: 1h

receivers:
  - name: "restaurant-ops-team"
    webhook_configs:
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  - name: "emergency-pager"
    webhook_configs:
      - url: "http://localhost:5001/critical-alerts"
        send_resolved: true
