global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "restovyn-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:4000"]
    relabel_configs:
      - target_label: application
        replacement: restovyn-api

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - target_label: database
        replacement: restovyn-postgres

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - target_label: cache
        replacement: restovyn-redis

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
