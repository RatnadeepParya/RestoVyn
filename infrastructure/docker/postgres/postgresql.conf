# =====================================================================
# RestoVyn Enterprise Database Configuration — PostgreSQL 16
# Optimized for High-Concurrency Transactional POS & Kitchen Operations
# =====================================================================

# ---------------------------------------------------------------------
# CONNECTIONS & NETWORKING
# ---------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 200                  # Augmented to 1000+ via PgBouncer transaction pooling
superuser_reserved_connections = 5

# ---------------------------------------------------------------------
# MEMORY TUNING (Based on typical 2GB - 4GB container RAM allocation)
# ---------------------------------------------------------------------
shared_buffers = 512MB                 # 25% of memory for shared cache
work_mem = 16MB                        # Dedicated memory for sort & hash joins per operation
maintenance_work_mem = 128MB           # Memory for VACUUM, CREATE INDEX, ALTER TABLE
effective_cache_size = 1536MB          # Estimate of total memory available for disk caching

# ---------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) & CHECKPOINTS
# ---------------------------------------------------------------------
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9     # Spread checkpoint I/O over 90% of interval
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB
archive_mode = off                     # Turn 'on' when streaming to WAL-G or S3/GCS in prod

# ---------------------------------------------------------------------
# DISK & STORAGE ENGINE OPTIMIZATION (SSD / NVMe)
# ---------------------------------------------------------------------
random_page_cost = 1.1                 # Fast random access on solid state storage
seq_page_cost = 1.0
effective_io_concurrency = 200         # Concurrent asynchronous disk operations

# ---------------------------------------------------------------------
# QUERY TUNING & PARALLEL WORKERS
# ---------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------------
# AUTOVACUUM TUNING (Critical for high-velocity order line items)
# ---------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05  # Trigger vacuum when 5% rows change
autovacuum_analyze_scale_factor = 0.02 # Trigger analyze when 2% rows change
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 500

# ---------------------------------------------------------------------
# LOGGING & AUDIT
# ---------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250       # Log any query taking longer than 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on                    # Crucial for diagnosing concurrency lock waits
log_statement = 'ddl'                  # Log schema changes
log_temp_files = 0                     # Log when queries spill to disk
log_timezone = 'UTC'

# ---------------------------------------------------------------------
# LOCK & DEADLOCK MANAGEMENT
# ---------------------------------------------------------------------
deadlock_timeout = 1s
statement_timeout = 30000              # 30 second query timeout to prevent runaway queries
idle_in_transaction_session_timeout = 60000 # 60 seconds max idle in transaction
