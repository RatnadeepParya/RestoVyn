# =====================================================================
# RestoVyn Enterprise Redis 7 Configuration
# High-Reliability Session Caching & WebSocket Pub/Sub
# =====================================================================

# ---------------------------------------------------------------------
# NETWORK & GENERAL
# ---------------------------------------------------------------------
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# ---------------------------------------------------------------------
# SNAPSHOTTING (RDB)
# ---------------------------------------------------------------------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------------------------------------------------------------------
# APPEND ONLY MODE (AOF Persistence - Zero Data Loss)
# ---------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---------------------------------------------------------------------
# MEMORY MANAGEMENT
# ---------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy volatile-lru
maxmemory-samples 5

# ---------------------------------------------------------------------
# LAZY FREEING & PERFORMANCE
# ---------------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ---------------------------------------------------------------------
# SLOW LOG & MONITORING
# ---------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ---------------------------------------------------------------------
# SECURITY COMMAND RENAMING (Hardening against accidental data destruction)
# ---------------------------------------------------------------------
# In production, requirepass is injected via REDIS_PASSWORD environment variable
rename-command FLUSHDB "RESTOVYN_ADMIN_FLUSHDB"
rename-command FLUSHALL "RESTOVYN_ADMIN_FLUSHALL"
rename-command CONFIG "RESTOVYN_ADMIN_CONFIG"
