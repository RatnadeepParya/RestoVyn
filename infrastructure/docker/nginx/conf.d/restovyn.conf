upstream restovyn_api {
    server api:4000;
    keepalive 32;
}

upstream restovyn_admin {
    server admin-web:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------
# HTTP SERVER (Port 80)
# Handles ACME challenges & redirects to HTTPS or serves local LAN
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Health probe for load balancers & container orchestrators
    location /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"restovyn-nginx"}';
    }

    # API Proxy
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://restovyn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Strict Rate-Limiting for Authentication & POS PIN logins
    location ~* ^/api/v1/auth/(login|pin-login)$ {
        limit_req zone=auth_strict_limit burst=5 nodelay;

        proxy_pass http://restovyn_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    # WebSockets Proxy (Socket.IO for POS, KDS & Captain real-time sync)
    location /socket.io/ {
        proxy_pass http://restovyn_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Admin Web Panel Proxy (Next.js)
    location / {
        proxy_pass http://restovyn_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
