;; =====================================================================
;; RestoVyn Enterprise PgBouncer Configuration
;; High-Throughput Connection Pooling for High-Concurrency POS Operations
;; =====================================================================

[databases]
;; Direct mapped database routing to primary PostgreSQL container
restovyn_db = host=postgres port=5432 dbname=restovyn_db auth_user=restovyn
* = host=postgres port=5432

[pgbouncer]
;; Network configuration
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

;; Connection Limits & Pooling Strategy
;; Mode: transaction (Best for REST/GraphQL API & POS transactions)
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 150

;; Timeouts & Connection Hygiene
server_reset_query = DISCARD ALL
server_check_delay = 10
server_check_query = SELECT 1
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 30
query_wait_timeout = 60

;; Low-level TCP & OS Tuning
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10
pkt_buf = 4096
listen_backlog = 128
