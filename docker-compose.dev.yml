version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: restovyn-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: restovyn
      POSTGRES_PASSWORD: resto_secret_pass
      POSTGRES_DB: restovyn_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restovyn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restovyn-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
